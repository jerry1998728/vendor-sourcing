name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # the build never calls external services; keys are only read at request time
          NODE_ENV: production
