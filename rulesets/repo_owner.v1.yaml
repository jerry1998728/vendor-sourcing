# rulesets/repo_owner.v1.yaml — H1a: GitHub organisations whose public signals indicate
# production-grade private codebases (PRD §2). Thresholds live here, not in code.
name: repo_owner
version: v1
vendor_type: code_data
description: >-
  Organisations that own production-grade codebases. 200 merged PRs across public repos is the
  proxy for private-repo engineering volume; production-grade = at least 3 of CI, release tags,
  tests directory, license, lockfile; active in the last 90 days; not a fork or tutorial org.

fields:
  - path: merged_prs_public
    type: number
    description: Merged pull requests across the organisation's public repositories (GitHub search count, proxy).
  - path: production_signals
    type: number
    description: How many of ci_config, release_tags, test_directory, license, lockfile are present on the top repositories (0-5).
  - path: ci_config
    type: boolean
    description: A CI configuration (.github/workflows or equivalent) exists on a top repository.
  - path: release_tags
    type: boolean
    description: Releases or version tags exist on a top repository.
  - path: test_directory
    type: boolean
    description: A tests directory exists on a top repository.
  - path: license
    type: boolean
    description: A license file is declared on a top repository.
  - path: lockfile
    type: boolean
    description: A dependency lockfile exists on a top repository.
  - path: last_commit_days
    type: number
    description: Days since the most recent push across the organisation's repositories.
  - path: is_fork_or_tutorial
    type: boolean
    description: The top repositories are forks, or the organisation reads as a tutorial / awesome-list / course account.
  - path: public_repos
    type: number
    description: Number of public repositories.
  - path: stars_total
    type: number
    description: Stars across the sampled top repositories.
  - path: org_type
    type: enum
    values: [company, foundation, individual, broker]
    description: Kind of organisation.
  - path: code_language
    type: list
    description: Primary languages across the top repositories.
  - path: code_license
    type: enum
    values: [permissive, copyleft, proprietary, unknown]
    description: License family of the top repositories.
  - path: website
    type: string
    description: Organisation website.
  - path: headquarters
    type: string
    description: Location text from the organisation profile.
  - path: registration_country
    type: country
    description: Country inferred from the profile location, ISO alpha-2 (proxy).

must:
  - id: merged_prs
    field_path: merged_prs_public
    op: gte
    value: 200
    description: At least 200 merged PRs across public repositories (proxy).
  - id: production_grade
    field_path: production_signals
    op: gte
    value: 3
    description: At least 3 of CI, release tags, tests directory, license, lockfile.
  - id: active
    field_path: last_commit_days
    op: lte
    value: 90
    description: Last commit within 90 days.
  - id: not_fork_or_tutorial
    field_path: is_fork_or_tutorial
    op: is_false
    description: Not a fork or tutorial organisation.

should:
  - id: high_volume
    weight: 2
    field_path: merged_prs_public
    op: gte
    value: 1000
  - id: company
    weight: 1
    field_path: org_type
    op: eq
    value: company
  - id: many_repos
    weight: 1
    field_path: public_repos
    op: gte
    value: 10
  - id: popular
    weight: 1
    field_path: stars_total
    op: gte
    value: 2000
  - id: has_website
    weight: 1
    field_path: website
    op: present

# Due-diligence checklist for vendors under evaluation. Answers are evidence
# rows: a source URL or an attestation, or the answer does not count.
diligence:
  - id: licence_audit
    category: compliance
    label: Licence audit of the codebase
    description: Licences of the repositories and their dependencies are compatible with training use.
    required: true
  - id: provenance
    category: compliance
    label: Code provenance confirmed
    description: The organisation owns or has the right to license the code offered, including contributions from outside parties.
    required: true
  - id: contributor_agreements
    category: compliance
    label: Contributor agreements in place
    description: A CLA or equivalent covers the contributors whose code is included.
    required: false
  - id: secrets_scan
    category: security
    label: Secrets and credentials scan
    description: A sample of the offered code was scanned for keys, tokens and personal data.
    required: true
  - id: build_reproducible
    category: technical
    label: Build and tests reproducible
    description: A sample repository builds and its tests run from a clean checkout.
    required: false
  - id: pricing_received
    category: financial
    label: Pricing received in writing
    description: A written quote with unit, minimum order and delivery terms.
    required: true
  - id: entity_confirmed
    category: financial
    label: Legal entity and standing confirmed
    description: Registration confirmed against a public register, plus any financial standing check.
    required: false
