# configs/code_data_brokers.yaml  (H1b: vendors/brokers who resell code or repository data; PRD "cut if behind")
adapter: web_search_llm
vendor_type: repo_owner
ruleset: repo_owner@v1
seed_queries:
  - "source code dataset licensing vendor for LLM training"
  - "code data provider private repositories licensed for AI training"
  - "software repository data broker commercial license"
  - "company selling curated code datasets with pull request history"
  - "code training data marketplace enterprise repositories"
  - "proprietary codebase data licensing for foundation models"
